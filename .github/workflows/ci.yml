# 코드 검사 — 푸시·PR 마다 파이썬 테스트(ffmpeg·한글 폰트 포함)와 Edge Function 테스트.
# 주차 데이터가 없을 수 있으므로 `plan validate` 는 돌리지 않는다. 비밀값은 쓰지 않는다.
name: ci

on:
  push:
    paths-ignore:
      - "content/**"
      - "reports/**"
      - "archive/**"
      - "docs/research/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: ffmpeg 설치
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg

      - name: 패키지 설치
        run: pip install -e ".[dev]"

      - name: 한글 폰트
        run: python -m studio setup fonts

      - name: pytest
        run: python -m pytest

  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 타입 검사·린트
        run: |
          deno check supabase/functions/go/index.ts supabase/functions/revenuecat-webhook/index.ts
          deno lint supabase/functions

      - name: Edge Function 테스트
        run: deno test --no-prompt supabase/functions/tests/
