# 주간 제작·발행 — 매주 일요일 12:00 KST(= 03:00 UTC).
# Claude 가 /weekly-publish start 로 기획 → 원고 → 렌더 → 독창성 검사 → 예약 발행까지 끝내고,
# 결과(content/ · archive/ · reports/)를 봇 계정으로 커밋한다. 렌더 결과(out/)는 7일 보관 아티팩트로 남긴다.
# 수동 실행: Actions → weekly-publish → Run workflow (주차 지정·리허설 가능). 설정: docs/SETUP.md
name: weekly-publish

on:
  schedule:
    - cron: "0 3 * * 0" # 일 12:00 KST — channel.yaml schedule.weekly_run 과 맞춘다
  workflow_dispatch:
    inputs:
      week:
        description: "주차(예: 2026-W42). 비우면 이번 정기 실행 주차"
        required: false
        default: ""
      dry_run:
        description: "리허설 — 실제 업로드·유료 음성 합성 없이(STUDIO_DRY_RUN=1, --tts silent), 커밋하지 않음"
        type: boolean
        default: false

permissions:
  contents: write # 결과 커밋·푸시
  issues: write # 실패 알림 이슈

concurrency:
  group: weekly-publish
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: utf-8
      STUDIO_TOKEN_BACKEND: supabase
      STUDIO_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
      # 비밀값 — 이름은 계약 그대로(studio/secrets_spec.py). Claude 인증 키는 액션 입력으로만 넘긴다.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
      GOOGLE_TTS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_TTS_CREDENTIALS_JSON }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      TISTORY_STORAGE_STATE_B64: ${{ secrets.TISTORY_STORAGE_STATE_B64 }}
      LAW_API_OC: ${{ secrets.LAW_API_OC }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: ffmpeg 설치
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg
          ffmpeg -hide_banner -version | head -n 1

      - name: 패키지 설치
        run: pip install -e ".[dev]"

      - name: 한글 폰트
        run: python -m studio setup fonts

      - name: TTS 서비스 계정 키 → 파일
        run: |
          if [ -z "${GOOGLE_TTS_CREDENTIALS_JSON:-}" ]; then
            echo "::warning::GOOGLE_TTS_CREDENTIALS_JSON 이 없습니다 — 음성 합성은 리허설(--tts silent)만 됩니다."
            exit 0
          fi
          umask 077
          printf '%s' "$GOOGLE_TTS_CREDENTIALS_JSON" > "$RUNNER_TEMP/gcp-tts.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-tts.json" >> "$GITHUB_ENV"

      - name: 주차·명령 정하기
        id: prep
        env:
          WEEK_INPUT: ${{ inputs.week }}
        run: |
          week="${WEEK_INPUT:-}"
          if [ -z "$week" ]; then
            week="$(python -c 'from studio import paths; print(paths.publishing_week())')"
          fi
          if ! [[ "$week" =~ ^[0-9]{4}-W[0-9]{2}$ ]]; then
            echo "::error::주차 형식이 아닙니다: $week (예: 2026-W42)"
            exit 1
          fi
          args="start --week $week"
          if [ "${STUDIO_DRY_RUN:-}" = "1" ]; then args="$args --dry-run"; fi
          echo "week=$week" >> "$GITHUB_OUTPUT"
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "주차 $week · /weekly-publish $args"

      - name: 캐시 복원(음성·법령 원문)
        uses: actions/cache@v5
        with:
          path: out/cache
          key: studio-cache-${{ steps.prep.outputs.week }}-${{ github.run_id }}
          restore-keys: |
            studio-cache-${{ steps.prep.outputs.week }}-
            studio-cache-

      - name: 설정 점검(doctor)
        continue-on-error: true
        run: python -m studio doctor

      - name: Claude — /weekly-publish
        id: claude
        uses: anthropics/claude-code-action@v1 # 확인: v1.0.248 (2026-10-09)
        with:
          prompt: "/weekly-publish ${{ steps.prep.outputs.args }}"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --max-turns 400
            --allowedTools "Bash(python -m studio *),Bash(python3 -m studio *),Bash(STUDIO_DRY_RUN=1 python -m studio *),Read,Write,Edit,Glob,Grep"
            --disallowedTools "Read(//proc/**),Read(//home/runner/work/_temp/**)"
            ${{ vars.CLAUDE_MODEL && format('--model {0}', vars.CLAUDE_MODEL) || '' }}

      - name: 파이프라인 완료 확인
        # Claude 세션이 끝났어도 주간 단계가 덜 끝났으면 실패로 표시해 알림 이슈가 생기게 한다.
        if: steps.claude.outcome == 'success'
        env:
          WEEK: ${{ steps.prep.outputs.week }}
        run: |
          python - <<'PY'
          import json, os, sys
          from studio import paths
          week = os.environ["WEEK"]
          p = paths.content_dir(week) / "pipeline.json"
          steps = (json.loads(p.read_text(encoding="utf-8")) if p.exists() else {}).get("steps", {})
          need = ["prepare", "validate", "originality-render", "upload-media", "schedule"]
          bad = [s for s in need if not steps.get(s, {}).get("ok")]
          if bad:
              print(f"::error::{week} 주간 파이프라인 미완료 단계: {', '.join(bad)} — content/weeks/{week}/RUN_REPORT.md 를 확인하세요.")
              sys.exit(1)
          print(f"{week} 주간 파이프라인 완료: {', '.join(need)}")
          PY

      - name: 결과 요약
        if: always() && steps.prep.outputs.week != ''
        env:
          WEEK: ${{ steps.prep.outputs.week }}
        run: |
          {
            echo "## weekly-publish $WEEK${STUDIO_DRY_RUN:+ (리허설)}"
            echo '```'
            python -m studio weekly status --week "$WEEK" 2>&1 | tail -n 80 || true
            echo '```'
            if [ -f "content/weeks/$WEEK/RUN_REPORT.md" ]; then
              echo
              head -c 30000 "content/weeks/$WEEK/RUN_REPORT.md"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 결과 커밋·푸시
        if: ${{ !cancelled() && env.STUDIO_DRY_RUN != '1' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEEK: ${{ steps.prep.outputs.week }}
        run: bash scripts/ci_commit_push.sh "weekly-publish ${WEEK:-?}" content archive reports

      - name: 렌더 결과 보관(7일)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: out-${{ steps.prep.outputs.week || github.run_id }}-${{ github.run_attempt }}
          path: |
            out/
            !out/cache/
          retention-days: 7
          if-no-files-found: ignore
          compression-level: 0 # 영상은 이미 압축돼 있다

      - name: 리허설 원고 보관(7일)
        if: always() && env.STUDIO_DRY_RUN == '1' && steps.prep.outputs.week != ''
        uses: actions/upload-artifact@v6
        with:
          name: content-${{ steps.prep.outputs.week }}-rehearsal-${{ github.run_attempt }}
          path: content/weeks/${{ steps.prep.outputs.week }}/
          retention-days: 7
          if-no-files-found: ignore

      - name: 실패 알림
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEEK: ${{ steps.prep.outputs.week }}
        run: |
          summary="$RUNNER_TEMP/failure-summary.txt"
          if [ -n "${WEEK:-}" ]; then python -m studio weekly status --week "$WEEK" > "$summary" 2>&1 || true; fi
          bash scripts/ci_failure_report.sh "weekly-publish" "$summary"
